[package]
name = "yagbas"
description = "Yagbas is a compiler for a language of the same name."
repository = "https://github.com/Lokathor/yagbas"
homepage = "https://lokathor.github.io/yagbas/"
version = "0.3.0"
edition = "2024"
license = "Zlib OR Apache-2.0 OR MIT"

[profile.release]
codegen-units = 1
lto = true

[features]

[dependencies]
bimap = "0.6.3"
bytemuck = "1.25.2"
ena = "0.14.4"
fnv = "1.0.7"
imbl = "7.0.2"
tinyvec = { version = "1.13.0", features = ["experimental_write_impl", "latest_stable_rust"] }
